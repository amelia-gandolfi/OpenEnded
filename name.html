<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What should people call you? — Makeshift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600&family=Shantell+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141412;
    --muted:#6E6C64;
    --blue:#2B4FE3;
    --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;
    --marker:"Shantell Sans",var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff;color:var(--ink);
    font:400 15px/1.5 var(--sans);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:32px 24px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:min(440px, 100%);text-align:center}
  h1{
    font:500 clamp(32px, 5vw, 44px)/1.2 var(--marker);
  }
  form{margin-top:36px}
  input{
    width:100%;
    font:400 28px/1.2 var(--sans);
    text-align:center;color:var(--ink);
    background:transparent;
    border:none;border-bottom:1.5px solid var(--ink);
    border-radius:0;
    padding:8px 4px 10px;
  }
  input::placeholder{color:#B7B5AC}
  input:focus{outline:none}
  button{
    margin-top:28px;
    background:var(--blue);color:#fff;border:none;cursor:pointer;
    font:400 15px/1 var(--sans);letter-spacing:.04em;
    padding:16px 28px;border-radius:999px;
  }
  button:hover{background:#2446cc}
  button:disabled{opacity:.35;cursor:default;background:var(--blue)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .note{
    margin-top:28px;
    font:400 13px/1.45 var(--sans);
    color:var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>what should people call you?</h1>
  <form id="nameForm">
    <input id="name" name="name" type="text" autocomplete="nickname" maxlength="40" placeholder="your name" required>
    <button type="submit" id="go" disabled>that's me</button>
  </form>
  <p class="note">that’s the whole profile. no photo, no bio.</p>
</main>
<script>
const input = document.getElementById('name');
const button = document.getElementById('go');
const saved = localStorage.getItem('makeshift-name');
if(saved) input.value = saved;
const sync = () => { button.disabled = input.value.trim().length === 0; };
input.addEventListener('input', sync);
sync();
input.focus();
document.getElementById('nameForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = input.value.trim();
  if(!name) return;
  localStorage.setItem('makeshift-name', name);
  location.href = 'interests.html';
});
</script>
</body>
</html>
