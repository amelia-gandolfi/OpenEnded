<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenEnded</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141412;
    --green:#1E9E57;
    --red:#F4442E;
    --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff;color:#fff;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .logo{
    position:fixed;z-index:2;left:30px;top:22px;
    font:800 clamp(56px, 8vw, 88px)/.86 var(--display);
    letter-spacing:-.065em;color:var(--ink);
  }
  main{
    min-height:100%;
    display:flex;align-items:center;justify-content:center;gap:48px;
    padding:120px 32px 48px;
  }
  .world{
    width:min(280px, 42vw);aspect-ratio:1;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:36px;
    text-decoration:none;color:#fff;
    font:800 clamp(26px, 3vw, 34px)/.98 var(--display);
    letter-spacing:-.04em;
    box-shadow:0 18px 28px -18px rgba(20,20,18,.45);
  }
  .world.green{background:var(--green);transform:rotate(-6deg)}
  .world.red{background:var(--red);transform:rotate(5deg)}
  .world:hover{filter:brightness(1.06)}
  .world:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
  @media (max-width:700px){
    main{flex-direction:column;gap:28px}
    .world{width:min(240px, 70vw)}
  }
</style>
</head>
<body>
<p class="logo">OpenEnded</p>
<main>
  <a class="world green" href="world-prototype.html">Waiting on a train</a>
  <a class="world red" href="crochet.html">Crochet</a>
</main>
</body>
</html>
